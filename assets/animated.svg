<svg xmlns="http://www.w3.org/2000/svg"
     width="700"
     height="400"
     viewBox="0 0 700 400">

  <defs>
    <clipPath id="imageClip">
      <rect x="0" y="0" width="700" height="400"/>
    </clipPath>
  </defs>

  <g clip-path="url(#imageClip)">

    <image
      href="portrait.png"
      x="0"
      y="-400"
      width="700"
      height="400"
      preserveAspectRatio="xMidYMid slice">

      <animate
        attributeName="y"
        from="-400"
        to="0"
        dur="1.4s"
        begin="0s"
        fill="freeze"/>

    </image>

  </g>

</svg>
