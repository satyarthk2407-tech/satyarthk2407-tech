name: Generate Dot Matrix Portrait

on:
  push:
    branches:
      - main
    paths:
      - "assets/portrait.png"
      - "scripts/dot_portrait.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate dot matrix portrait
        run: python scripts/dot_portrait.py

      - name: Commit generated portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/portrait.svg

          git diff --staged --quiet || git commit -m "chore: generate dot matrix portrait"

          git push
