name: Charts and cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/projects.json"
      - "scripts/radar.py"
      - "scripts/cards.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cyber Security skill radar
      - name: Cyber Security skill radar
        run: |
          python scripts/radar.py \
            --data assets/skills.json \
            -o assets/radar \
            --values

      # Language / programming skill radar
      # Uses the same hand-authored skills.json so Java
      # appears even before there is enough Java code on GitHub.
      - name: Programming language radar
        run: |
          python scripts/radar.py \
            --data assets/skills.json \
            -o assets/radar-langs \
            --title "Programming Language Radar" \
            --values

      # Project cards
      - name: Stat and repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --projects assets/projects.json \
            --out assets

      # Commit generated charts and cards
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-*.svg assets/card-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts and cards"
          git push
