name: Charts and cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/languages.json"
      - "assets/projects.json"
      - "scripts/radar.py"
      - "scripts/cards.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # CYBER SECURITY RADAR
      # ---------------------------------------------------------
      - name: Generate Cyber Security Radar
        run: |
          python scripts/radar.py \
            --data assets/skills.json \
            -o assets/radar \
            --values

      # ---------------------------------------------------------
      # PROGRAMMING LANGUAGE RADAR
      # ---------------------------------------------------------
      - name: Generate Programming Language Radar
        run: |
          python scripts/radar.py \
            --data assets/languages.json \
            -o assets/radar-langs \
            --values

      # ---------------------------------------------------------
      # PROJECT / STAT CARDS
      # ---------------------------------------------------------
      - name: Generate project cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --projects assets/projects.json \
            --out assets

      # ---------------------------------------------------------
      # SAVE GENERATED FILES
      # ---------------------------------------------------------
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/radar-*.svg assets/card-*.svg

          git diff --staged --quiet || git commit \
            -m "chore: update charts and cards"

          git push
